[project]
name = "recipe-mcp"
version = "0.1.0"
description = "Local MCP server for recipe unit conversion, scaling, baker's percentages, ingredient weight/volume density, and an Ollama cooking assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recipe-mcp = "recipe_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recipe_mcp"]

[tool.setuptools.package-data]
# data/ lives beside the package; shipped via MANIFEST for sdist, loaded by path at runtime.

[tool.pytest.ini_options]
testpaths = ["tests"]
